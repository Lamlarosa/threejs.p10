<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explorer - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background-color: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        canvas { display: block; }
        
        #ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(10, 40, 60, 0.85);
            padding: 20px;
            border-left: 5px solid #00d2ff;
            border-radius: 6px;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            min-width: 280px;
        }
        h1 { font-size: 1.25rem; margin-bottom: 5px; color: #00d2ff; text-transform: uppercase; letter-spacing: 1px;}
        p { font-size: 0.85rem; color: #b0c4de; margin-bottom: 10px; }
        .system-badge {
            display: inline-block;
            background: #1e5a7a;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #e0f7fa;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        #info-text { 
            color: #ffd700; 
            font-weight: bold; 
            font-size: 1rem;
            background: rgba(255, 215, 0, 0.15);
            padding: 10px;
            border-radius: 4px;
            display: none; 
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h1>Observasi Alam</h1>
        <div class="system-badge">TIM EKSPLORER: Alam-TRPL</div>
        <p>Arahkan kursor & klik objek untuk inspeksi</p>
        <div id="info-text"></div>
    </div>
    
    <canvas id="webgl-canvas"></canvas>

    <script type="module" src="app.js"></script>
</body>
</html>
